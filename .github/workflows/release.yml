name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Verify the release
        run: |
          npm.cmd run typecheck
          npm.cmd test

      - name: Build the Windows installer
        run: npm.cmd run dist -- --publish never

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $notes = (git for-each-ref "refs/tags/$env:RELEASE_TAG" --format="%(contents)" | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "LeagueVid $env:RELEASE_TAG"
          }

          $summary = ($notes -split "`r?`n" | Select-Object -First 1).Trim()
          $title = "LeagueVid $env:RELEASE_TAG — $summary"

          $installer = Get-ChildItem -LiteralPath dist -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $installer) {
            throw 'The Windows installer was not produced.'
          }

          # The in-app updater refuses to run an installer unless its SHA-256
          # matches this separately published checksum.
          $checksumPath = "$($installer.FullName).sha256"
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$checksum  $($installer.Name)" -NoNewline

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A normal fix moves the existing tag rather than bumping the
            # version, so refresh the notes as well as the binary. The updater
            # shows these notes before asking the user to install.
            gh release edit $env:RELEASE_TAG --title $title --notes $notes
            gh release upload $env:RELEASE_TAG $installer.FullName $checksumPath --clobber
          } else {
            gh release create $env:RELEASE_TAG $installer.FullName $checksumPath `
              --verify-tag `
              --title $title `
              --notes $notes
          }
